<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aquamentor Vector Studio</title>
<style>
  :root {
    --bg: #323232;          /* app chrome */
    --panel: #2a2a2b;       /* panel bodies */
    --panel-head: #383838;  /* panel section headers */
    --edge: #1f1f1f;        /* borders between chrome regions */
    --canvas: #1b1b1b;      /* pasteboard behind artboard */
    --text: #d6d6d6;
    --text-dim: #9a9a9a;
    --accent: #3a8ee6;      /* selection / active-tool blue */
    --tool: #b8b8b8;        /* toolbar icon color */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font: 12px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    display: grid;
    grid-template-rows: 28px 1fr 22px;
    grid-template-columns: 40px 1fr 264px;
    grid-template-areas:
      "menu menu menu"
      "tools stage panels"
      "status status status";
    user-select: none; -webkit-user-select: none;
  }

  /* ---- menu bar ---- */
  #menubar {
    grid-area: menu; display: flex; align-items: center;
    background: var(--bg); border-bottom: 1px solid var(--edge);
    padding: 0 10px; gap: 2px;
  }
  #menubar .brand {
    font-weight: 600; color: var(--text); margin-right: 14px;
    letter-spacing: .2px;
  }
  #menubar .brand span { color: var(--accent); }
  #menubar .menu {
    padding: 3px 9px; border-radius: 3px; color: var(--text-dim); cursor: default;
  }
  #menubar .menu:hover, #menubar .menu.open { background: #3f3f40; color: var(--text); }

  /* ---- dropdown menus ---- */
  .dropdown {
    position: fixed; min-width: 180px; z-index: 100;
    background: #2f2f30; border: 1px solid #1a1a1a; border-radius: 4px;
    padding: 4px; box-shadow: 0 6px 20px rgba(0,0,0,.5);
  }
  .dropdown .item {
    display: flex; justify-content: space-between; gap: 24px;
    padding: 5px 10px; border-radius: 3px; color: var(--text); cursor: default;
  }
  .dropdown .item:hover:not(.disabled) { background: var(--accent); color: #fff; }
  .dropdown .item.disabled { color: #6a6a6a; }
  .dropdown .kbd { color: var(--text-dim); }
  .dropdown .item:hover:not(.disabled) .kbd { color: #dbe9ff; }

  /* ---- left toolbar ---- */
  #toolbar {
    grid-area: tools; background: var(--bg); border-right: 1px solid var(--edge);
    display: flex; flex-direction: column; align-items: center; padding-top: 6px; gap: 2px;
  }
  #toolbar button {
    width: 32px; height: 30px; border: 0; border-radius: 4px;
    background: transparent; color: var(--tool); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #toolbar button:hover { background: #3f3f40; color: #fff; }
  #toolbar button.active { background: var(--accent); color: #fff; }
  #toolbar .sep { width: 22px; height: 1px; background: var(--edge); margin: 4px 0; }
  #toolbar svg { width: 17px; height: 17px; display: block; }

  /* ---- stage ---- */
  #stagewrap { grid-area: stage; position: relative; background: var(--canvas); overflow: hidden; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #stagewrap.tool-hand #stage { cursor: grab; }
  #stagewrap.tool-hand.panning #stage { cursor: grabbing; }
  #stagewrap.tool-zoom #stage { cursor: zoom-in; }
  #stagewrap.tool-eyedrop #stage { cursor: crosshair; }

  /* ---- right panels ---- */
  #panels {
    grid-area: panels; background: var(--panel); border-left: 1px solid var(--edge);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .panel { border-bottom: 1px solid var(--edge); }
  .panel > h2 {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
    color: var(--text-dim); background: var(--panel-head);
    padding: 5px 10px; cursor: default;
  }
  .panel .body { padding: 8px 10px; }
  .prow { display: flex; justify-content: space-between; align-items: center; padding: 2px 0; }
  .prow .k { color: var(--text-dim); }
  .prow .v { color: var(--text); font-variant-numeric: tabular-nums; }
  .pbtns { display: flex; gap: 6px; margin-top: 6px; }
  .pbtns button {
    flex: 1; padding: 4px 0; border: 1px solid #4a4a4a; border-radius: 3px;
    background: #3a3a3b; color: var(--text); cursor: pointer; font-size: 11px;
  }
  .pbtns button:hover { background: #454546; }

  /* form controls shared by the fill/stroke, stroke and swatch panels */
  .panel input, .panel select {
    background: #232324; color: var(--text); border: 1px solid #4a4a4a; border-radius: 3px;
    padding: 2px 4px; font: inherit;
  }
  .panel input.num { width: 54px; text-align: right; font-variant-numeric: tabular-nums; }
  .panel input#col-hex { width: 66px; }
  .panel input.txt { width: 92px; }
  .panel input[type="range"] {
    padding: 0; border: 0; background: none; accent-color: var(--accent);
    height: 14px; vertical-align: middle;
  }
  .panel input:disabled, .panel select:disabled, .panel button:disabled { opacity: .4; cursor: default; }

  /* segmented option rows (cap / join / stroke alignment) */
  .segrow { display: flex; gap: 3px; }
  .segrow button {
    width: 26px; height: 22px; padding: 0; border: 1px solid #4a4a4a; border-radius: 3px;
    background: #3a3a3b; color: var(--tool); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .segrow button:hover:not([disabled]) { background: #454546; color: #fff; }
  .segrow button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .segrow svg { width: 16px; height: 16px; }

  /* fill & stroke indicator — overlapping wells, Illustrator style */
  .fsrow { display: flex; gap: 10px; align-items: flex-start; }
  .fswells { position: relative; width: 62px; height: 62px; flex: none; }
  .fswells .well {
    position: absolute; width: 34px; height: 34px; padding: 0; overflow: visible;
    border: 1px solid #6a6a6a; border-radius: 0; background: #fff; cursor: pointer;
  }
  .fswells .well.fill { left: 0; top: 0; }
  .fswells .well.stroke { left: 20px; top: 20px; }
  .fswells .well.active { border-color: #fff; box-shadow: 0 0 0 1px #171717; z-index: 2; }
  .fswells .well i { display: block; width: 100%; height: 100%; box-sizing: border-box; }
  .fswells .well.stroke i { border: 7px solid #000; }
  .fswells .well.none::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to top right, transparent calc(50% - 1px),
      #e03a3a calc(50% - 1px), #e03a3a calc(50% + 1px), transparent calc(50% + 1px));
  }
  .fswells .fsmini {
    position: absolute; width: 15px; height: 15px; padding: 0; z-index: 3;
    border: 1px solid #4a4a4a; border-radius: 2px; background: #3a3a3b;
    color: var(--text); cursor: pointer; font-size: 9px; line-height: 1;
  }
  .fswells .fsmini:hover { background: #454546; }
  #fs-swap { right: 0; top: 0; }
  #fs-default { left: 0; bottom: 0; }
  .fscol { flex: 1; min-width: 0; }
  .fscol .pbtns { margin-top: 0; }
  #fs-ink { color: var(--text-dim); padding: 3px 0 0; min-height: 16px; }

  /* color picker: saturation/brightness square beside a hue strip. The
     markers are elements over the canvases rather than drawn into them, so a
     repaint only costs a style write unless the hue itself moved. */
  .picker { display: flex; gap: 6px; margin: 8px 0 6px; }
  .picker .sq, .picker .strip {
    position: relative; height: 124px; border: 1px solid #4a4a4a; background: #000;
  }
  .picker .sq { flex: 1; min-width: 0; }
  .picker .strip { width: 14px; flex: none; }
  .picker canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  #col-sb-dot {
    position: absolute; width: 11px; height: 11px; margin: -6px 0 0 -6px; border-radius: 50%;
    border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.75), inset 0 0 0 1px rgba(0,0,0,.45);
    pointer-events: none;
  }
  #col-hue-bar {
    position: absolute; left: -3px; right: -3px; height: 3px; margin-top: -1.5px;
    border: 1px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.75); pointer-events: none;
  }

  /* color picker rows */
  .crow { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
  .crow label { width: 12px; color: var(--text-dim); }
  .crow input[type="range"] { flex: 1; min-width: 0; }
  .crow input.num { width: 46px; }

  /* swatches */
  #swatchgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 6px; }
  #swatchgrid .swatch {
    position: relative; height: 22px; border: 1px solid #55555a; cursor: pointer; background: #fff;
  }
  #swatchgrid .swatch.sel { border-color: #fff; box-shadow: 0 0 0 1px var(--accent); }
  #swatchgrid .swatch.noneswatch {
    background: linear-gradient(to top right, transparent calc(50% - 1px),
      #e03a3a calc(50% - 1px), #e03a3a calc(50% + 1px), transparent calc(50% + 1px)), #fff;
  }
  /* spot/Separation inks carry a corner dot the way Illustrator marks them */
  #swatchgrid .swatch.spot::after {
    content: ''; position: absolute; right: 1px; bottom: 1px; width: 5px; height: 5px;
    border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.65);
  }
  #swatchname { color: var(--text-dim); padding-bottom: 4px; min-height: 16px; }

  /* align panel */
  .alignrow { display: flex; gap: 4px; margin-bottom: 4px; }
  .alignrow button {
    width: 30px; height: 26px; border: 1px solid #4a4a4a; border-radius: 3px;
    background: #3a3a3b; color: var(--tool); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .alignrow button:hover:not([disabled]) { background: #454546; color: #fff; }
  .alignrow button[disabled] { opacity: .35; cursor: default; }
  .alignrow svg { width: 15px; height: 15px; }

  /* layers list */
  #layerlist { list-style: none; }
  #layerlist li {
    display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 3px;
  }
  #layerlist li:hover { background: #343435; }
  #layerlist .eye { cursor: pointer; width: 16px; text-align: center; color: var(--text-dim); }
  #layerlist .eye.on { color: var(--text); }
  #layerlist .lname { flex: 1; }

  /* ---- status bar ---- */
  #statusbar {
    grid-area: status; display: flex; align-items: center; gap: 18px;
    background: var(--bg); border-top: 1px solid var(--edge);
    padding: 0 12px; color: var(--text-dim); font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  #statusbar .right { margin-left: auto; display: flex; gap: 18px; align-items: center; }
  /* what the eyedropper is over, shown only while it is the active tool */
  #s-sample { display: none; align-items: center; gap: 6px; }
  #statusbar.sampling #s-sample { display: flex; }
  #s-sample i { display: block; width: 11px; height: 11px; border: 1px solid #6a6a6a; }
  #s-sample b { font-weight: 400; color: var(--text); }
</style>
</head>
<body>

<div id="menubar">
  <div class="brand">AQ<span>Vector</span></div>
  <div class="menu" data-menu="file">File</div>
  <div class="menu" data-menu="edit">Edit</div>
  <div class="menu" data-menu="object">Object</div>
  <div class="menu">View</div>
  <div class="menu">Window</div>
</div>

<div id="toolbar">
  <button data-tool="select" title="Selection (V)">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M6 2 L6 16 L9.6 12.6 L12 18 L14.2 17 L11.8 11.8 L16.5 11.5 Z"/></svg>
  </button>
  <button data-tool="direct" title="Direct Selection (A)">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 2.8 L6 15 L9.4 11.9 L11.8 16.8 L13.7 15.9 L11.5 11.2 L15.6 10.9 Z"/></svg>
  </button>
  <div class="sep"></div>
  <button data-tool="pen" title="Pen (P)">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 2 L13 9 L10 13 L7 9 Z"/><path d="M10 13 L10 17"/><circle cx="10" cy="10" r="1" fill="currentColor" stroke="none"/></svg>
  </button>
  <button data-tool="rect" title="Rectangle (M)">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3.5" y="5" width="13" height="10"/></svg>
  </button>
  <button data-tool="ellipse" title="Ellipse (L)">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><ellipse cx="10" cy="10" rx="6.5" ry="5"/></svg>
  </button>
  <button data-tool="eyedrop" title="Eyedropper (I) — click samples the whole appearance, Shift-click just the color">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
      <path d="M13.2 2.9a2.4 2.4 0 0 1 3.4 3.4l-1.9 1.9-3.4-3.4z"/>
      <path d="M12.4 5.6 4.5 13.5 3.3 16.7 6.5 15.5 14.4 7.6"/>
    </svg>
  </button>
  <div class="sep"></div>
  <button data-tool="hand" title="Hand (H) — or hold Space">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 10.5 V4.8 a1.2 1.2 0 0 1 2.4 0 V9 M9.4 9 V3.8 a1.2 1.2 0 0 1 2.4 0 V9 M11.8 9 V4.8 a1.2 1.2 0 0 1 2.4 0 V11.5 c0 3-1.8 5.5-4.6 5.5 c-2.4 0-3.6-1.2-4.8-3.6 L3.4 11.6 a1.15 1.15 0 0 1 2-1.1 L7 12.5"/></svg>
  </button>
  <button data-tool="zoom" title="Zoom (Z) — click in, Alt-click out">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2 L17 17"/><path d="M6.5 9 H11.5 M9 6.5 V11.5"/></svg>
  </button>
</div>

<div id="stagewrap">
  <canvas id="stage"></canvas>
</div>

<div id="panels">
  <div class="panel">
    <h2>Properties</h2>
    <div class="body">
      <div class="prow"><span class="k">Document</span><span class="v" id="p-name">—</span></div>
      <div class="prow"><span class="k">Artboard</span><span class="v" id="p-artboard">—</span></div>
      <div class="prow"><span class="k">Zoom</span><span class="v" id="p-zoom">—</span></div>
      <div class="prow"><span class="k">Tool</span><span class="v" id="p-tool">—</span></div>
      <div class="prow"><span class="k">Selection</span><span class="v" id="p-sel">—</span></div>
      <div class="pbtns">
        <button id="btn-fit" title="Cmd+0">Fit</button>
        <button id="btn-100" title="Cmd+1">100%</button>
      </div>
    </div>
  </div>
  <div class="panel">
    <h2>Fill &amp; Stroke</h2>
    <div class="body">
      <div class="fsrow">
        <div class="fswells">
          <button class="well fill active" id="well-fill" data-paint="fill" title="Fill — X targets the other"><i></i></button>
          <button class="well stroke" id="well-stroke" data-paint="stroke" title="Stroke — X targets the other"><i></i></button>
          <button class="fsmini" id="fs-swap" title="Swap fill and stroke (Shift+X)">⇄</button>
          <button class="fsmini" id="fs-default" title="Default fill and stroke (D)">◱</button>
        </div>
        <div class="fscol">
          <div class="pbtns">
            <button id="fs-none" title="Paint the target None">None</button>
            <button id="fs-tosw" title="Add the current color to Swatches">+ Swatch</button>
          </div>
          <div class="prow"><span class="k">Hex</span><input class="num" id="col-hex" type="text" maxlength="7" spellcheck="false"></div>
          <div class="prow"><span class="k">Model</span>
            <select id="col-model">
              <option value="rgb">RGB</option>
              <option value="cmyk">CMYK</option>
              <option value="hsb">HSB</option>
            </select>
          </div>
        </div>
      </div>
      <div class="picker">
        <div class="sq" title="Saturation and brightness">
          <canvas id="col-sb"></canvas><i id="col-sb-dot"></i>
        </div>
        <div class="strip" title="Hue">
          <canvas id="col-hue"></canvas><i id="col-hue-bar"></i>
        </div>
      </div>
      <div id="col-sliders"></div>
      <div id="fs-ink">—</div>
      <div class="prow"><span class="k">Opacity</span><span class="v">
        <input id="op-range" type="range" min="0" max="100" step="1" value="100">
        <input class="num" id="op-num" type="number" min="0" max="100" step="1" value="100">
      </span></div>
    </div>
  </div>
  <div class="panel">
    <h2>Stroke</h2>
    <div class="body">
      <div class="prow"><span class="k">Weight</span><span class="v">
        <input class="num" id="st-w" type="number" min="0" step="0.25"> pt
      </span></div>
      <div class="prow"><span class="k">Cap</span>
        <span class="segrow" id="st-cap">
          <button data-cap="butt" title="Butt cap">
            <svg viewBox="0 0 16 16"><path d="M3 8 H11" stroke="currentColor" stroke-width="6" stroke-linecap="butt" fill="none"/><path d="M11 2.5 V13.5" stroke="rgba(0,0,0,.6)" stroke-width="1"/></svg>
          </button>
          <button data-cap="round" title="Round cap">
            <svg viewBox="0 0 16 16"><path d="M3 8 H11" stroke="currentColor" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M11 2.5 V13.5" stroke="rgba(0,0,0,.6)" stroke-width="1"/></svg>
          </button>
          <button data-cap="square" title="Projecting cap">
            <svg viewBox="0 0 16 16"><path d="M3 8 H11" stroke="currentColor" stroke-width="6" stroke-linecap="square" fill="none"/><path d="M11 2.5 V13.5" stroke="rgba(0,0,0,.6)" stroke-width="1"/></svg>
          </button>
        </span>
      </div>
      <div class="prow"><span class="k">Join</span>
        <span class="segrow" id="st-join">
          <button data-join="miter" title="Miter join">
            <svg viewBox="0 0 16 16"><path d="M4 13 V5 H12" stroke="currentColor" stroke-width="5" stroke-linejoin="miter" fill="none"/></svg>
          </button>
          <button data-join="round" title="Round join">
            <svg viewBox="0 0 16 16"><path d="M4 13 V5 H12" stroke="currentColor" stroke-width="5" stroke-linejoin="round" fill="none"/></svg>
          </button>
          <button data-join="bevel" title="Bevel join">
            <svg viewBox="0 0 16 16"><path d="M4 13 V5 H12" stroke="currentColor" stroke-width="5" stroke-linejoin="bevel" fill="none"/></svg>
          </button>
        </span>
      </div>
      <div class="prow"><span class="k">Miter limit</span><span class="v">
        <input class="num" id="st-miter" type="number" min="1" step="1">
      </span></div>
      <div class="prow"><span class="k">Align</span>
        <span class="segrow" id="st-align">
          <button data-align2="center" title="Align stroke to center">
            <svg viewBox="0 0 16 16"><rect x="2" y="3" width="6" height="10" fill="currentColor" opacity=".25"/><path d="M8 3 V13" stroke="currentColor" stroke-width="4" opacity=".8"/><path d="M8 2 V14" stroke="rgba(0,0,0,.6)" stroke-width="1"/></svg>
          </button>
          <button data-align2="inside" title="Align stroke to inside">
            <svg viewBox="0 0 16 16"><rect x="2" y="3" width="6" height="10" fill="currentColor" opacity=".25"/><path d="M6 3 V13" stroke="currentColor" stroke-width="4" opacity=".8"/><path d="M8 2 V14" stroke="rgba(0,0,0,.6)" stroke-width="1"/></svg>
          </button>
          <button data-align2="outside" title="Align stroke to outside">
            <svg viewBox="0 0 16 16"><rect x="2" y="3" width="6" height="10" fill="currentColor" opacity=".25"/><path d="M10 3 V13" stroke="currentColor" stroke-width="4" opacity=".8"/><path d="M8 2 V14" stroke="rgba(0,0,0,.6)" stroke-width="1"/></svg>
          </button>
        </span>
      </div>
      <div class="prow"><span class="k">Dash</span><span class="v">
        <input class="txt" id="st-dash" type="text" placeholder="solid — e.g. 6 3" spellcheck="false">
      </span></div>
    </div>
  </div>
  <div class="panel">
    <h2>Swatches</h2>
    <div class="body">
      <div id="swatchgrid"></div>
      <div id="swatchname">—</div>
      <div class="pbtns">
        <button id="sw-new" title="Add the current color as a swatch">New</button>
        <button id="sw-rename" title="Rename the selected swatch">Rename</button>
        <button id="sw-delete" title="Delete the selected swatch">Delete</button>
      </div>
    </div>
  </div>
  <div class="panel">
    <h2>Align</h2>
    <div class="body">
      <div class="alignrow">
        <button data-align="left" title="Align left edges">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 2v12"/><rect x="5" y="3.5" width="8" height="3.2"/><rect x="5" y="9.3" width="5" height="3.2"/></svg>
        </button>
        <button data-align="hcenter" title="Align horizontal centers">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 2v12"/><rect x="4" y="3.5" width="8" height="3.2"/><rect x="5.5" y="9.3" width="5" height="3.2"/></svg>
        </button>
        <button data-align="right" title="Align right edges">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M13 2v12"/><rect x="3" y="3.5" width="8" height="3.2"/><rect x="6" y="9.3" width="5" height="3.2"/></svg>
        </button>
        <button data-align="hdist" title="Distribute horizontal centers">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 3v10M8 3v10M13 3v10"/></svg>
        </button>
      </div>
      <div class="alignrow">
        <button data-align="top" title="Align top edges">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 3h12"/><rect x="3.5" y="5" width="3.2" height="8"/><rect x="9.3" y="5" width="3.2" height="5"/></svg>
        </button>
        <button data-align="vcenter" title="Align vertical centers">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 8h12"/><rect x="3.5" y="4" width="3.2" height="8"/><rect x="9.3" y="5.5" width="3.2" height="5"/></svg>
        </button>
        <button data-align="bottom" title="Align bottom edges">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 13h12"/><rect x="3.5" y="3" width="3.2" height="8"/><rect x="9.3" y="6" width="3.2" height="5"/></svg>
        </button>
        <button data-align="vdist" title="Distribute vertical centers">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 3h10M3 8h10M3 13h10"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div class="panel">
    <h2>Layers</h2>
    <div class="body"><ul id="layerlist"></ul></div>
  </div>
</div>

<div id="statusbar">
  <span id="s-coords">x: — y: —</span>
  <div class="right">
    <span id="s-sample"><i></i><b>—</b></span>
    <span id="s-tool">Selection</span>
    <span id="s-zoom">100%</span>
  </div>
</div>
