      if (e) return e.value;
      // brute: find "<num> 0 obj <int>" in the raw file
      const re = new RegExp('(?:^|[^0-9])(' + String(v.ref) + ')[\\0\\t\\n\\f\\r ]+\\d+[\\0\\t\\n\\f\\r ]+obj\\b');
      const m = re.exec(this.S);
      if (m) {
        try { return parseObj(this.S, m.index + m[0].length).v; } catch (e2) { return null; }
      }
      return null;
    }
    return v;
  }

  rawStream(entry) {
    return this.bytes.subarray(entry.streamStart, entry.streamEnd);
  }

  async decodeStream(entry) {
    let data = this.rawStream(entry);
    const dict = entry.value || {};
    let filters = this.resolve(dict.Filter);
    let parms = this.resolve(dict.DecodeParms || dict.DP);
    if (!filters) return data;
    if (!Array.isArray(filters)) { filters = [filters]; parms = [parms]; }
    else if (!Array.isArray(parms)) { parms = [parms]; }
    for (let i = 0; i < filters.length; i++) {
      const f = this.resolve(filters[i]);
      const p = this.resolve(parms[i]) || null;
      if (isName(f, 'FlateDecode') || isName(f, 'Fl')) {
        data = await inflate(data);
        data = this.applyPredictor(data, p);
      } else if (isName(f, 'ASCIIHexDecode') || isName(f, 'AHx')) {
        const s = latin1(data).replace(/[^0-9a-fA-F>]/g, '');
        const hex = s.replace(/>.*$/, '');
        const out = new Uint8Array(Math.ceil(hex.length / 2));
        for (let k = 0; k < hex.length; k += 2) out[k >> 1] = parseInt(hex.substr(k, 2).padEnd(2, '0'), 16);
        data = out;
      } else if (f) {
        throw new Error('Unsupported stream filter: ' + (f.name || f));
      }
    }
    return data;
  }

  applyPredictor(data, parms) {
    if (!parms) return data;
    const pred = this.resolve(parms.Predictor) || 1;
    if (pred < 2) return data;
    const colors = this.resolve(parms.Colors) || 1;
    const bpc = this.resolve(parms.BitsPerComponent) || 8;
    const columns = this.resolve(parms.Columns) || 1;
    const bpp = Math.max(1, Math.ceil(colors * bpc / 8));
    const rowLen = Math.ceil(colors * bpc * columns / 8);
    if (pred === 2) return data; // TIFF predictor on 8-bit rare; pass through
    // PNG predictors: each row prefixed with a filter-type byte
    const rows = Math.floor(data.length / (rowLen + 1));
    const out = new Uint8Array(rows * rowLen);
    let prev = new Uint8Array(rowLen);
    for (let r = 0; r < rows; r++) {
      const ft = data[r * (rowLen + 1)];
      const src = data.subarray(r * (rowLen + 1) + 1, (r + 1) * (rowLen + 1));
      const dst = out.subarray(r * rowLen, (r + 1) * rowLen);
      for (let x = 0; x < rowLen; x++) {
        const a = x >= bpp ? dst[x - bpp] : 0;
        const b = prev[x];
        const c = x >= bpp ? prev[x - bpp] : 0;
        let v = src[x];
        if (ft === 1) v += a;
        else if (ft === 2) v += b;
        else if (ft === 3) v += (a + b) >> 1;
        else if (ft === 4) {
          const pp = a + b - c, pa = Math.abs(pp - a), pb = Math.abs(pp - b), pc = Math.abs(pp - c);
          v += (pa <= pb && pa <= pc) ? a : (pb <= pc ? b : c);
        }
        dst[x] = v & 0xff;
      }
      prev = dst;
    }
    return out;
  }

  async expandObjectStreams() {
    for (const [, entry] of Array.from(this.objects)) {
      const v = entry.value;
      if (!v || typeof v !== 'object' || !isName(v.Type, 'ObjStm')) continue;
      let data;
      try { data = await this.decodeStream(entry); } catch (e) { continue; }
      const S = latin1(data);
      const N = this.resolve(v.N) || 0;
      const first = this.resolve(v.First) || 0;
      let i = 0;
      const header = [];
      for (let k = 0; k < N; k++) {
        const a = parseObj(S, i); const b = parseObj(S, a.i);
        header.push([a.v, b.v]);
        i = b.i;
      }
      for (const [num, off] of header) {
        if (typeof num !== 'number' || typeof off !== 'number') continue;
        if (this.objects.has(num)) continue; // directly-scanned objects win
        try {
          const parsed = parseObj(S, first + off);
          this.objects.set(num, { value: parsed.v });
        } catch (e) { /* skip bad member */ }
      }
    }
  }

  findCatalog() {
    let root = this.resolve(this.trailer.Root);
    if (root && isName(root.Type, 'Catalog')) return root;
    for (const [, e] of this.objects) {
      const v = e.value;
      if (v && typeof v === 'object' && isName(v.Type, 'Catalog')) return v;
    }
    return null;
  }

  collectPages() {
    const cat = this.findCatalog();
    const pages = [];
    const walk = (node, inherited, depth) => {
      node = this.resolve(node);
      if (!node || typeof node !== 'object' || depth > 64) return;
      const inh = {
        MediaBox: node.MediaBox !== undefined ? node.MediaBox : inherited.MediaBox,
        Resources: node.Resources !== undefined ? node.Resources : inherited.Resources,
        Rotate: node.Rotate !== undefined ? node.Rotate : inherited.Rotate,
      };
      if (isName(node.Type, 'Pages') || (node.Kids && !isName(node.Type, 'Page'))) {
        const kids = this.resolve(node.Kids) || [];
        for (const k of kids) walk(k, inh, depth + 1);
      } else if (isName(node.Type, 'Page') || node.Contents !== undefined) {
        pages.push({ dict: node, inherited: inh });
      }
    };
    if (cat && cat.Pages) walk(cat.Pages, {}, 0);
    if (!pages.length) { // last resort: scan for page dicts
      for (const [, e] of this.objects) {
        const v = e.value;
        if (v && typeof v === 'object' && isName(v.Type, 'Page')) {
          pages.push({ dict: v, inherited: {} });
        }
      }
    }
    return pages;
  }

  async pageContent(pageDict) {
    let contents = this.resolve(pageDict.Contents);
    if (!contents) return new Uint8Array(0);
    if (!Array.isArray(contents)) contents = [pageDict.Contents];
    const parts = [];
    for (const c of contents) {
      const ref = c && typeof c === 'object' && 'ref' in c ? this.objects.get(c.ref) : null;
      const entry = ref || (typeof c === 'object' ? { value: this.resolve(c) } : null);
      if (!entry || entry.streamStart === undefined) continue;
      try { parts.push(await this.decodeStream(entry)); }
      catch (e) { /* skip undecodable part */ }
    }
    let total = 0;
    for (const p of parts) total += p.length + 1;
    const out = new Uint8Array(total);
    let o = 0;
    for (const p of parts) { out.set(p, o); o += p.length; out[o++] = 0x0a; }
    return out;
  }
}

/* ------------------------------------------------------------------ */
/* Matrices & colors                                                   */
/* ------------------------------------------------------------------ */

function matMul(m, n) { // apply m "after" n?  result = n · m (PDF: cm concatenates before CTM)
  return [
    m[0] * n[0] + m[1] * n[2],
    m[0] * n[1] + m[1] * n[3],
    m[2] * n[0] + m[3] * n[2],
    m[2] * n[1] + m[3] * n[3],
    m[4] * n[0] + m[5] * n[2] + n[4],
    m[4] * n[1] + m[5] * n[3] + n[5],
  ];
}
function matApply(m, x, y) {
  return { x: m[0] * x + m[2] * y + m[4], y: m[1] * x + m[3] * y + m[5] };
}
function matScale(m) {
  return Math.sqrt(Math.abs(m[0] * m[3] - m[1] * m[2])) || 1;
}

function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
function cmyk2rgb(c, m, y, k) {
  return [clamp01((1 - c) * (1 - k)), clamp01((1 - m) * (1 - k)), clamp01((1 - y) * (1 - k))];
}
function colGray(g) { g = clamp01(g); return { space: 'gray', values: [g], rgb: [g, g, g] }; }
function colRGB(r, g, b) { return { space: 'rgb', values: [r, g, b].map(clamp01), rgb: [r, g, b].map(clamp01) }; }
function colCMYK(c, m, y, k) {
  const v = [c, m, y, k].map(clamp01);
  return { space: 'cmyk', values: v, rgb: cmyk2rgb(v[0], v[1], v[2], v[3]) };
}

function colorKey(col) {
  if (!col) return '';
  return col.space + ':' + (col.name || '') + ':' + col.values.map(v => v.toFixed(4)).join(',');
}

/* ------------------------------------------------------------------ */
/* PDF functions (for Separation tint transforms)                      */
/* ------------------------------------------------------------------ */

async function evalFunction(doc, fnRefOrDict, inputs) {
  const entry = fnRefOrDict && typeof fnRefOrDict === 'object' && 'ref' in fnRefOrDict
    ? doc.objects.get(fnRefOrDict.ref) : { value: doc.resolve(fnRefOrDict) };
  if (!entry || !entry.value || typeof entry.value !== 'object') return null;
  const fn = entry.value;
  const type = doc.resolve(fn.FunctionType);
  const domain = (doc.resolve(fn.Domain) || [0, 1]).map(Number);
  const x = Math.min(Math.max(inputs[0], domain[0]), domain[1]);

  if (type === 2) {
    const c0 = (doc.resolve(fn.C0) || [0]).map(Number);
    const c1 = (doc.resolve(fn.C1) || [1]).map(Number);
    const n = doc.resolve(fn.N) || 1;
    const t = Math.pow(x, n);
    const out = [];
    for (let i = 0; i < Math.max(c0.length, c1.length); i++) {
      out.push((c0[i] || 0) + t * ((c1[i] || 0) - (c0[i] || 0)));
    }
    return out;
  }
  if (type === 3) {
    const fns = doc.resolve(fn.Functions) || [];
    const bounds = (doc.resolve(fn.Bounds) || []).map(Number);
    const encode = (doc.resolve(fn.Encode) || []).map(Number);
    let k = 0;
    while (k < bounds.length && x >= bounds[k]) k++;
    const lo = k === 0 ? domain[0] : bounds[k - 1];
    const hi = k === bounds.length ? domain[1] : bounds[k];
    const e0 = encode.length > 2 * k ? encode[2 * k] : 0;
    const e1 = encode.length > 2 * k + 1 ? encode[2 * k + 1] : 1;
    const t = hi === lo ? e0 : e0 + (x - lo) / (hi - lo) * (e1 - e0);
    return evalFunction(doc, fns[k], [t]);
  }
  if (type === 0 && entry.streamStart !== undefined) {
    try {
      const data = await doc.decodeStream(entry);
      const size = (doc.resolve(fn.Size) || [2]).map(Number);
      const bps = doc.resolve(fn.BitsPerSample) || 8;
      const range = (doc.resolve(fn.Range) || []).map(Number);
      const nOut = range.length ? range.length / 2 : 1;
      if (bps !== 8 && bps !== 16) return null;
      const nSamples = size[0];
      const t = (x - domain[0]) / (domain[1] - domain[0] || 1);
      const idx = Math.min(nSamples - 1, Math.round(t * (nSamples - 1)));
      const out = [];
      for (let i = 0; i < nOut; i++) {
        let raw, max;
        if (bps === 8) { raw = data[idx * nOut + i]; max = 255; }
        else { const o = (idx * nOut + i) * 2; raw = (data[o] << 8) | data[o + 1]; max = 65535; }
        const r0 = range.length ? range[2 * i] : 0;
        const r1 = range.length ? range[2 * i + 1] : 1;
        out.push(r0 + (raw / max) * (r1 - r0));
      }
      return out;
    } catch (e) { return null; }
  }
  return null; // Type 4 (PostScript calculator) & exotic cases
}

/* ------------------------------------------------------------------ */
/* Color spaces                                                        */
/* ------------------------------------------------------------------ */

function csFamily(doc, cs) {
  // Returns {kind, n, name?, alt?, tint?} for a resolved colorspace value.
  cs = doc.resolve(cs);
  if (!cs) return { kind: 'gray', n: 1 };
  if (cs.name) {
    switch (cs.name) {
      case 'DeviceGray': case 'CalGray': case 'G': return { kind: 'gray', n: 1 };
      case 'DeviceRGB': case 'CalRGB': case 'RGB': return { kind: 'rgb', n: 3 };
      case 'DeviceCMYK': case 'CMYK': return { kind: 'cmyk', n: 4 };
      case 'Pattern': return { kind: 'pattern', n: 1 };
      default: return { kind: 'gray', n: 1 };
    }
  }
  if (Array.isArray(cs)) {
    const head = doc.resolve(cs[0]);
    const hname = head && head.name;
    if (hname === 'ICCBased') {
      const strm = doc.resolve(cs[1]);
      const n = (strm && doc.resolve(strm.N)) || 3;
      return n === 4 ? { kind: 'cmyk', n: 4 } : n === 1 ? { kind: 'gray', n: 1 } : { kind: 'rgb', n: 3 };
    }
    if (hname === 'CalRGB' || hname === 'Lab') return { kind: 'rgb', n: 3 };
    if (hname === 'CalGray') return { kind: 'gray', n: 1 };
    if (hname === 'Separation') {
      const nm = doc.resolve(cs[1]);
      return { kind: 'separation', n: 1, name: (nm && nm.name) || 'Spot', alt: cs[2], tint: cs[3] };
    }
    if (hname === 'DeviceN') {
      const names = (doc.resolve(cs[1]) || []).map(v => (doc.resolve(v) || {}).name || '?');
      return { kind: 'devicen', n: names.length, name: names.join('+'), alt: cs[2], tint: cs[3] };
    }
    if (hname === 'Indexed') return { kind: 'gray', n: 1 };
    if (hname === 'Pattern') return { kind: 'pattern', n: 1 };
  }
  return { kind: 'gray', n: 1 };
}

async function makeColorFromCS(doc, fam, comps) {
  switch (fam.kind) {
    case 'gray': return colGray(comps[0] !== undefined ? comps[0] : 0);
    case 'rgb': return colRGB(comps[0] || 0, comps[1] || 0, comps[2] || 0);
    case 'cmyk': return colCMYK(comps[0] || 0, comps[1] || 0, comps[2] || 0, comps[3] || 1);
    case 'pattern': return { space: 'pattern', values: [], rgb: [0.5, 0.5, 0.5] };
    case 'separation': case 'devicen': {
      const tint = comps.length ? comps[0] : 1;
      let rgb = null, alt = null, values = comps.slice();
      // Evaluate the tint transform at full strength: that alternate build is
      // the ink's own definition, and keeping it lets the exporter write the
      // plate back out as a real /Separation instead of flattening to RGB.
      const full = await evalFunction(doc, fam.tint, comps.map(() => 1));
      const out = await evalFunction(doc, fam.tint, comps.length ? comps : [1]);
      const altFam = csFamily(doc, fam.alt);
      if (full) {
        if (altFam.kind === 'cmyk' && full.length >= 4) alt = { space: 'cmyk', values: full.slice(0, 4).map(clamp01) };
        else if (altFam.kind === 'rgb' && full.length >= 3) alt = { space: 'rgb', values: full.slice(0, 3).map(clamp01) };
        else if (full.length >= 1) alt = { space: 'gray', values: [clamp01(full[0])] };
      }
      if (out) {
        if (altFam.kind === 'cmyk' && out.length >= 4) rgb = cmyk2rgb(out[0], out[1], out[2], out[3]);
        else if (altFam.kind === 'rgb' && out.length >= 3) rgb = out.slice(0, 3).map(clamp01);
        else if (out.length >= 1) rgb = [clamp01(out[0]), clamp01(out[0]), clamp01(out[0])];
      }
      if (!rgb) { const g = clamp01(1 - tint); rgb = [g, g, g]; } // fallback: tint as darkness
      return { space: 'separation', name: fam.name, values, rgb, alt };
    }
    default: return colGray(0);
  }
}

/* ------------------------------------------------------------------ */
/* Content-stream interpreter                                          */
/* ------------------------------------------------------------------ */

const TEXT_OPS = new Set(['BT', 'ET', 'Tc', 'Tw', 'Tz', 'TL', 'Tf', 'Tr', 'Ts',
  'Td', 'TD', 'Tm', 'T*', 'Tj', 'TJ', "'", '"']);
const IGNORE_OPS = new Set(['ri', 'i', 'j', 'J', 'M', 'd', 'gs', 'sh', 'd0', 'd1',
  'MP', 'DP', 'BMC', 'BDC', 'EMC', 'BX', 'EX', 'CS_UNKNOWN']);

async function runContentStream(doc, contentBytes, resources, gsInit, shapes, depth) {
  if (depth > 12) return;
  const S = latin1(contentBytes);
  let gs = gsInit;
  const gsStack = [];
  const operands = [];

  // path construction state (user space)
  let subpaths = [];      // finished subpaths of current path
  let cur = null;         // {start, segments, closed}
  let cx = 0, cy = 0;     // current point, user space
  let sx = 0, sy = 0;     // subpath start, user space

  const tp = (x, y) => matApply(gs.ctm, x, y);

  function moveTo(x, y) {
    if (cur && cur.segments.length) subpaths.push(cur);
    const p = tp(x, y);
    cur = { start: { x: p.x, y: p.y }, segments: [], closed: false };
    cx = x; cy = y; sx = x; sy = y;
  }
  function lineTo(x, y) {
    if (!cur) moveTo(cx, cy);
    const p = tp(x, y);
    cur.segments.push({ type: 'line', to: { x: p.x, y: p.y } });
    cx = x; cy = y;
  }
  function curveTo(x1, y1, x2, y2, x3, y3) {
    if (!cur) moveTo(cx, cy);
    const c1 = tp(x1, y1), c2 = tp(x2, y2), to = tp(x3, y3);
    cur.segments.push({ type: 'cubic', c1: { x: c1.x, y: c1.y }, c2: { x: c2.x, y: c2.y }, to: { x: to.x, y: to.y } });
    cx = x3; cy = y3;
  }
  function closePath() {
    if (cur) { cur.closed = true; subpaths.push(cur); cur = null; cx = sx; cy = sy; }
  }
  function endPath() { subpaths = []; cur = null; }

  function emit(fill, stroke, fillRule) {
    if (cur && (cur.segments.length || fill)) subpaths.push(cur);
    cur = null;
    const sp = subpaths.filter(p => p.segments.length > 0);
    if (sp.length) {
      shapes.push({
        subpaths: sp,
        fill: fill || null,
        stroke: stroke || null,
        strokeWidth: stroke ? gs.lineWidth * matScale(gs.ctm) : 0,
        fillRule: fillRule || 'nonzero',
      });
    }
    subpaths = [];
  }

  function lookupCS(nameOrVal) {
    if (nameOrVal && nameOrVal.name) {
      const n = nameOrVal.name;
      if (n === 'DeviceGray' || n === 'DeviceRGB' || n === 'DeviceCMYK' || n === 'Pattern' ||
          n === 'G' || n === 'RGB' || n === 'CMYK') {
        return csFamily(doc, nameOrVal);
      }
      const csDict = doc.resolve(resources && resources.ColorSpace) || {};
      if (csDict[n] !== undefined) return csFamily(doc, csDict[n]);
    }
    return csFamily(doc, nameOrVal);
  }

  let i = 0;
  const len = S.length;
  while (i < len) {
    i = skipWs(S, i);
    if (i >= len) break;
    const c = S[i];
    if (c === '/' || c === '(' || c === '<' || c === '[' ||
        c === '+' || c === '-' || c === '.' || (c >= '0' && c <= '9')) {
      const r = parseObj(S, i);
      operands.push(r.v);
      i = r.i;
      continue;
    }
    // operator token
    let j = i;
    while (j < len && !isWs(S[j]) && !isDelim(S[j])) j++;
    const op = S.slice(i, j === i ? i + 1 : j);
    i = j === i ? i + 1 : j;
    const nums = operands.map(v => (typeof v === 'number' ? v : 0));

    try {
      switch (op) {
        /* graphics state */
        case 'q': gsStack.push({ ...gs, fill: gs.fill, stroke: gs.stroke }); break;
        case 'Q': if (gsStack.length) gs = gsStack.pop(); break;
        case 'cm': gs = { ...gs, ctm: matMul(nums.slice(0, 6), gs.ctm) }; break;
        case 'w': gs = { ...gs, lineWidth: nums[0] }; break;

        /* path construction */
        case 'm': moveTo(nums[0], nums[1]); break;
        case 'l': lineTo(nums[0], nums[1]); break;
        case 'c': curveTo(nums[0], nums[1], nums[2], nums[3], nums[4], nums[5]); break;
        case 'v': curveTo(cx, cy, nums[0], nums[1], nums[2], nums[3]); break;
        case 'y': curveTo(nums[0], nums[1], nums[2], nums[3], nums[2], nums[3]); break;
        case 'h': closePath(); break;
        case 're': {
          const [x, y, w, h] = nums;
          moveTo(x, y); lineTo(x + w, y); lineTo(x + w, y + h); lineTo(x, y + h); closePath();
          break;
        }

        /* path painting */
        case 'f': case 'F': emit(gs.fill, null, 'nonzero'); break;
        case 'f*': emit(gs.fill, null, 'evenodd'); break;
        case 'S': emit(null, gs.stroke); break;
        case 's': closePath(); emit(null, gs.stroke); break;
        case 'B': emit(gs.fill, gs.stroke, 'nonzero'); break;
        case 'B*': emit(gs.fill, gs.stroke, 'evenodd'); break;
        case 'b': closePath(); emit(gs.fill, gs.stroke, 'nonzero'); break;
        case 'b*': closePath(); emit(gs.fill, gs.stroke, 'evenodd'); break;
        case 'n': endPath(); break;
        case 'W': case 'W*': break; // clipping ignored (geometry importer)

        /* color */
        case 'g': gs = { ...gs, fill: colGray(nums[0]), fillCS: { kind: 'gray', n: 1 } }; break;
        case 'G': gs = { ...gs, stroke: colGray(nums[0]), strokeCS: { kind: 'gray', n: 1 } }; break;
        case 'rg': gs = { ...gs, fill: colRGB(nums[0], nums[1], nums[2]), fillCS: { kind: 'rgb', n: 3 } }; break;
        case 'RG': gs = { ...gs, stroke: colRGB(nums[0], nums[1], nums[2]), strokeCS: { kind: 'rgb', n: 3 } }; break;
        case 'k': gs = { ...gs, fill: colCMYK(nums[0], nums[1], nums[2], nums[3]), fillCS: { kind: 'cmyk', n: 4 } }; break;
        case 'K': gs = { ...gs, stroke: colCMYK(nums[0], nums[1], nums[2], nums[3]), strokeCS: { kind: 'cmyk', n: 4 } }; break;
        case 'cs': {
          const fam = lookupCS(operands[0]);
          gs = { ...gs, fillCS: fam, fill: await makeColorFromCS(doc, fam, fam.kind === 'cmyk' ? [0, 0, 0, 1] : [0]) };
          break;
        }
        case 'CS': {
          const fam = lookupCS(operands[0]);
          gs = { ...gs, strokeCS: fam, stroke: await makeColorFromCS(doc, fam, fam.kind === 'cmyk' ? [0, 0, 0, 1] : [0]) };
          break;
        }
        case 'sc': case 'scn': {
          const comps = operands.filter(v => typeof v === 'number');
          gs = { ...gs, fill: await makeColorFromCS(doc, gs.fillCS, comps) };
          break;
        }
        case 'SC': case 'SCN': {
          const comps = operands.filter(v => typeof v === 'number');
          gs = { ...gs, stroke: await makeColorFromCS(doc, gs.strokeCS, comps) };
          break;
        }

        /* XObjects */
        case 'Do': {
          const nm = operands[0] && operands[0].name;
          const xobjs = doc.resolve(resources && resources.XObject) || {};
          const ref = nm !== undefined ? xobjs[nm] : null;
          const entry = ref && typeof ref === 'object' && 'ref' in ref
            ? doc.objects.get(ref.ref) : null;

      width: w, height: h,
      shapes,

    creator, producer,

// PDFIO — bridges VecPDF (pdfimport.js / pdfexport.js) onto the VECCORE
// document model. Import turns PDF/.ai vector pages into veccore shapes
// with color capture; export writes the artboard as a flat vector PDF.
//
// Color capture: shapes render with hex fills like everything else, but
// non-RGB source colors (CMYK builds, grayscale, spot inks) keep their
// print data in shape.fillInfo / shape.strokeInfo — {space, values, name}
// — and the document gets a doc.swatches palette. Export prefers that
// info over the hex preview, so CMYK/gray survive an import→edit→export
// trip; spot plates can build on doc.swatches later.
const PDFIO = (() => {
  'use strict';

  const C = typeof VECCORE !== 'undefined' ? VECCORE : require('./veccore.js');
  const P = (() => {
    if (typeof VecPDF !== 'undefined') return VecPDF;
    const api = require('./pdfimport.js');
    require('./pdfexport.js'); // merges exportPDF into the same namespace
    return api;

  // ---------- colors ----------
  function rgbToHex(rgb) {
    return '#' + rgb.map(v => {
      const n = Math.round(Math.max(0, Math.min(1, v)) * 255);
      return n.toString(16).padStart(2, '0');

    const n = parseInt(h, 16);
    return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];

  const PRINT_SPACES = { cmyk: 1, gray: 1, separation: 1 };

  function colorInfo(col) { // print-color data worth keeping past the hex preview
    if (!col || !PRINT_SPACES[col.space]) return null;
    const o = { space: col.space, values: col.values.slice() };
    if (col.name) o.name = col.name;
    // a spot ink's alternate build — what the exporter needs to write a plate
    if (col.alt) o.alt = { space: col.alt.space, values: col.alt.values.slice() };
    return o;

  function toExportColor(hex, info) {
    if (info && PRINT_SPACES[info.space] && Array.isArray(info.values)) {

    const parsed = await P.parsePDF(bytes);
    const page = parsed.pages[Math.max(0, Math.min(pageIndex, parsed.pages.length - 1))];

        // here rather than inside the (veccore-free) PDF writer.
        const off = C.strokeOffsetPath(s.cmds, s.stroke);

<script>

    drag: null,          // select-tool drag state machine

    autoFit: true,       // keep fitting on resize until the user changes the view
    target: 'fill',      // which paint the color picker and swatches drive
    paint: null,         // {fill, stroke} current paints — null means "none"
    pick: null,          // {fill, stroke} last real color per target, for the picker
    colorModel: 'rgb',   // picker entry mode: rgb | cmyk | hsb
    hsb: [0, 0, 1],      // the picker's own hue/sat/bright (see rememberHsb)

  // ---------- selection helpers ----------
  function commitNow() {

  }
  // A panel field fires its change event on blur, so anything about to move
  // the selection has to let it commit first — otherwise a weight or opacity
  // typed for one object lands on the next one.

    if (el && el.closest && el.closest('#panels')) el.blur();
  }
  function setSel(ids) {
    blurPanelField();
    state.sel = new Set(C.expandIds(state.doc, ids));
  }
  function selShapes() {
    return state.doc.shapes.filter(s => state.sel.has(s.id));
  }
  function selectableLayers() {
    return new Set(state.doc.layers.filter(l => l.visible && !l.locked).map(l => l.id));
  }
  function worldPt(e) {
    const r = canvas.getBoundingClientRect();
    return C.s2w(state.view, e.clientX - r.left, e.clientY - r.top);
  }
  function screenPt(e) {
    const r = canvas.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }
  function hitAt(wx, wy) {
    const ok = selectableLayers();
    const tol = 3 / state.view.scale;
    for (let i = state.doc.shapes.length - 1; i >= 0; i--) {
      const s = state.doc.shapes[i];
      if (!ok.has(s.layer)) continue;
      if (C.hitTestShape(s, wx, wy, tol)) return s;

  // bbox handle geometry (screen space)
  const HANDLE_FRAC = { nw: [0, 0], n: [.5, 0], ne: [1, 0], e: [1, .5], se: [1, 1], s: [.5, 1], sw: [0, 1], w: [0, .5] };
  const HANDLE_CURSOR = {
    nw: 'nwse-resize', se: 'nwse-resize', ne: 'nesw-resize', sw: 'nesw-resize',
    n: 'ns-resize', s: 'ns-resize', e: 'ew-resize', w: 'ew-resize',

    const v = state.view;

      const p = C.w2s(v, b.x + f[0] * b.w, b.y + f[1] * b.h);
      return { c, x: p[0], y: p[1] };

  function hitHandle(sx, sy) {

    const b = C.shapesBBox(selShapes());
    if (!b) return null;

    for (const h of pts) {
      if (Math.abs(sx - h.x) <= 5 && Math.abs(sy - h.y) <= 5) return { type: 'scale', c: h.c, bbox: b };
    }
    for (const h of pts) {
      if (h.c.length !== 2) continue; // corners only

    }
  }
  function snapshotSel() {
    return new Map(selShapes().map(s => [s.id, JSON.parse(JSON.stringify(s.cmds))]));
  }

  // ---------- document lifecycle ----------
  let autosaveTimer = 0;
  function scheduleAutosave() {
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(() => {
      try { localStorage.setItem(AUTOSAVE_KEY, C.serializeDoc(state.doc)); } catch (e) { /* quota */ }
    }, 400);
  }

  function mutate(fn) {
    fn(state.doc);
    if (C.commit(state.history, state.doc)) scheduleAutosave();
    renderLayers();
    render();
  }

  function refreshDoc() {
    // drop selection ids that no longer exist in the current doc

  }

  function doUndo() {
    const d = C.undo(state.history);

  }
  function doRedo() {

  function applyNewDoc(doc) {
    state.doc = doc;
    state.history = C.newHistory(doc);
    state.sel.clear();
    state.autoFit = true;
    scheduleAutosave();
    fitArtboard();
    refreshDoc();
  }

  function newFile() {
    if (state.doc.shapes.length && !window.confirm('Replace the current document with a new one?')) return;
    applyNewDoc(C.newDoc());
  }

  function saveFile() {
    const blob = new Blob([C.serializeDoc(state.doc)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (state.doc.name || 'Untitled') + '.aqv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);

  const fileInput = document.createElement('input');

  fileInput.accept = '.aqv,.json,.pdf,.ai,application/json,application/pdf';
  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0];
    fileInput.value = '';

  });
  function openFile() { fileInput.click(); }

  function openAqvFile(f) {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const doc = C.parseDoc(rd.result);
        doc.name = f.name.replace(/\.(aqv|json)$/i, '');

      } catch (err) {
        window.alert('Could not open "' + f.name + '": ' + err.message);

  function importPdfFile(f) {
    f.arrayBuffer()
      .then(buf => PDFIO.docFromPDF(new Uint8Array(buf), f.name))
      .then(res => {
        applyNewDoc(res.doc);
        if (res.pageCount > 1) {

            ' pages; imported page 1 (one artboard per document).');

      .catch(err => window.alert('Could not import "' + f.name + '": ' + err.message));
  }

  function openAnyFile(f) {
    if (/\.(pdf|ai)$/i.test(f.name) || f.type === 'application/pdf') importPdfFile(f);
    else openAqvFile(f);
  }

  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f && /\.(aqv|json|pdf|ai)$/i.test(f.name)) openAnyFile(f);

  function exportPdfFile() {
    try {
      const bytes = PDFIO.exportDocPDF(state.doc);
      const blob = new Blob([bytes], { type: 'application/pdf' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (state.doc.name || 'Untitled') + '.pdf';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    } catch (err) {
      window.alert('Export failed: ' + err.message);
    }
  }

  // ---------- rendering ----------
  let dpr = 1, vw = 0, vh = 0;

  function resize() {
    const r = stagewrap.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    vw = r.width; vh = r.height;

  function fitArtboard() {
    const ab = state.doc.artboard;
    state.view = C.fitRect(vw, vh, 0, 0, ab.w, ab.h, 48);
  }

  function appendPath(cmds) {
    for (const c of cmds) {

      else if (c[0] === 'L') ctx.lineTo(c[1], c[2]);

  // Offsetting is the costly part of an aligned stroke, so hold the last
  // result per shape and redo it only when the geometry — or the stroke that
  // shaped it — changes. Drags replace s.cmds outright, so identity is enough.
  const offsetCache = new WeakMap();
  function alignedPath(s) {
    const st = s.stroke;
    const key = C.strokeProp(st, 'align') + '|' + st.w + '|' +
      C.strokeProp(st, 'join') + '|' + C.strokeProp(st, 'miter');
    const hit = offsetCache.get(s);
    if (hit && hit.key === key && hit.cmds === s.cmds) return hit.path;
    const path = C.strokeOffsetPath(s.cmds, st);
    offsetCache.set(s, { key, cmds: s.cmds, path });

  // Canvas only centers strokes. An inside or outside stroke is a centered one
  // riding the path offset half a weight to that side, which is what keeps
  // caps, joins and dashes at their true size. The clip stays as a backstop:
  // it is what stops the stroke leaking across the edge where the shape is
  // thinner than the stroke, and it covers the case where the offset collapses
  // altogether. The current path on entry is the shape's, left by the fill pass.
  function strokeShape(s) {

            const q1 = C.w2s(state.view, u.bbox.x + u.bbox.w, u.bbox.y + u.bbox.h);

  // ---------- panels / readouts ----------
  function updateReadouts() {
    const ab = state.doc.artboard, k = C.PT_PER[state.doc.units];
    $('#p-name').textContent = state.doc.name || 'Untitled';
    $('#p-artboard').textContent = `${+(ab.w / k).toFixed(2)} × ${+(ab.h / k).toFixed(2)} ${state.doc.units}`;

      selEl.textContent = '—';
    }

    document.querySelectorAll('.alignrow button[data-align]').forEach(btn => {
      const dist = btn.dataset.align === 'hdist' || btn.dataset.align === 'vdist';

    syncStrokePanel();
    renderSwatches();
  }

  function renderLayers() {
    const ul = $('#layerlist');

    for (const l of state.doc.layers) {
      const li = document.createElement('li');
      const eye = document.createElement('span');
      eye.className = 'eye' + (l.visible ? ' on' : '');
      eye.textContent = l.visible ? '◉' : '○';
      eye.title = 'Toggle visibility';
      eye.addEventListener('click', () => mutate(d => {
        const dl = d.layers.find(x => x.id === l.id);
        if (dl) dl.visible = !dl.visible;
      }));
      const name = document.createElement('span');
      name.className = 'lname';
      name.textContent = l.name;
      li.append(eye, name);
      ul.appendChild(li);
    }
  }

  // ---------- fill, stroke & color ----------
  // The picker speaks the units people type: RGB 0-255, CMYK/HSB percentages,
  // hue in degrees. Everything below the panel boundary is 0..1 (see veccore).
  const COLOR_MODELS = {
    rgb: [{ k: 'R', max: 255 }, { k: 'G', max: 255 }, { k: 'B', max: 255 }],
    cmyk: [{ k: 'C', max: 100 }, { k: 'M', max: 100 }, { k: 'Y', max: 100 }, { k: 'K', max: 100 }],
    hsb: [{ k: 'H', max: 360 }, { k: 'S', max: 100 }, { k: 'B', max: 100 }],
  };

  function colorToModel(col, model) {
    const rgb = col ? col.rgb : [0, 0, 0];
    if (model === 'cmyk') {
      // a spot ink shows the build it actually prints as
      const v = col && col.space === 'cmyk' ? col.values
        : col && col.alt && col.alt.space === 'cmyk' ? col.alt.values
          : C.rgbToCmyk(rgb);
      return v.map(x => x * 100);
    }
    // HSB reads the picker's remembered triple, not a fresh conversion, so the
    // fields agree with the square and hue strip on colors where hue is
    // undefined. syncPaintPanel refreshes it from the color first.
    if (model === 'hsb') return [state.hsb[0], state.hsb[1] * 100, state.hsb[2] * 100];
    return rgb.map(x => x * 255);
  }

  // Black has no hue and no saturation, white has no hue: converting straight
  // out of RGB would snap the square's marker to a corner and lose where the
  // user was. Carry the undefined components over instead.
  function rememberHsb(col) {
    const [h, s, v] = C.rgbToHsb(col ? col.rgb : [0, 0, 0]);
    const prev = state.hsb;
    state.hsb = [s > 1e-6 && v > 1e-6 ? h : prev[0], v > 1e-6 ? s : prev[1], v];
    return state.hsb;
  }

  // What the square and hue strip paint with. In CMYK entry mode the pick is
  // converted on the way out so print work stays in CMYK.
  function pickedColor(hsb) {
    const rgb = C.hsbToRgb(hsb);
    return state.colorModel === 'cmyk'
      ? C.makeColor({ space: 'cmyk', values: C.rgbToCmyk(rgb) })
      : C.makeColor({ space: 'rgb', values: rgb });
  }

  function modelToColor(vals, model) {
    if (model === 'cmyk') return C.makeColor({ space: 'cmyk', values: vals.map(v => v / 100) });
    const rgb = model === 'hsb'
      ? C.hsbToRgb([vals[0], vals[1] / 100, vals[2] / 100])
      : vals.map(v => v / 255);
    return C.makeColor({ space: 'rgb', values: rgb });
  }

  // Effective paint of a target: the frontmost selected object's, or the app's
  // current paint when nothing is selected.
  function effectivePaint(kind) {
    const shapes = selShapes();
    if (!shapes.length) return state.paint[kind];
    const s = shapes[shapes.length - 1];
    if (kind === 'fill') return C.paintColor(s.fill, s.fillInfo);
    return s.stroke ? C.paintColor(s.stroke.color, s.strokeInfo) : null;
  }

  // Paint the whole selection in one shot. live=true skips the history entry
  // so dragging a slider ends up as a single undo step on release.
  function pushColor(col, live) {
    state.paint[state.target] = col;
    if (col) state.pick[state.target] = col;
    if (state.sel.size) {
      const ids = [...state.sel];
      if (state.target === 'fill') C.setFill(state.doc, ids, col);
      else C.setStroke(state.doc, ids, col);
      if (!live && C.commit(state.history, state.doc)) scheduleAutosave();
    }
    render();
  }

  function setTarget(t) {
    state.target = t;
    $('#well-fill').classList.toggle('active', t === 'fill');
    $('#well-stroke').classList.toggle('active', t === 'stroke');
    render();
  }

  function swapPaints() {
    if (state.sel.size) mutate(d => C.swapFillStroke(d, [...state.sel]));
    else {
      const f = state.paint.fill;
      state.paint.fill = state.paint.stroke;
      state.paint.stroke = f;
      render();
    }
  }

  function defaultPaints() {
    const white = C.makeColor({ space: 'cmyk', values: [0, 0, 0, 0] });
    const black = C.makeColor({ space: 'cmyk', values: [0, 0, 0, 1] });
    state.paint = { fill: white, stroke: black };
    state.pick = { fill: white, stroke: black };
    if (state.sel.size) {
      mutate(d => {
        const ids = [...state.sel];
        C.setFill(d, ids, white);
        C.setStroke(d, ids, black);
        C.setStrokeProps(d, ids, { w: 1 });
      });
    } else render();
  }

  // Only write inputs the user is not currently in — otherwise a repaint mid
  // drag or mid keystroke fights them for the caret.
  function setVal(el, v) { if (el !== document.activeElement) el.value = v; }

  // ---------- hue / saturation picker ----------
  const sbCanvas = $('#col-sb'), hueCanvas = $('#col-hue');
  let pickerHue = null;

  function sizeCanvas(cv) {
    const r = cv.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (cv.width === w && cv.height === h) return false;
    cv.width = w; cv.height = h;
    return true;
  }

  // The square is white -> full hue across, transparent -> black down: two
  // gradients rather than a per-pixel fill, which is why it can repaint on a
  // drag without costing anything.
  function paintSquare(h) {
    const g = sbCanvas.getContext('2d');
    const w = sbCanvas.width, ht = sbCanvas.height;
    let grad = g.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(1, C.rgbToHex(C.hsbToRgb([h, 1, 1])));
    g.fillStyle = grad;
    g.fillRect(0, 0, w, ht);
    grad = g.createLinearGradient(0, 0, 0, ht);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, '#000000');
    g.fillStyle = grad;
    g.fillRect(0, 0, w, ht);
  }

  function paintHueStrip() {
    const g = hueCanvas.getContext('2d');
    const w = hueCanvas.width, ht = hueCanvas.height;
    const grad = g.createLinearGradient(0, 0, 0, ht);
    for (let i = 0; i <= 6; i++) grad.addColorStop(i / 6, C.rgbToHex(C.hsbToRgb([i * 60, 1, 1])));
    g.fillStyle = grad;
    g.fillRect(0, 0, w, ht);
  }

  function drawPicker() {
    const [h, s, v] = state.hsb;
    const grew = sizeCanvas(sbCanvas);
    if (sizeCanvas(hueCanvas) || grew) paintHueStrip();
    if (grew || pickerHue !== h) { pickerHue = h; paintSquare(h); }
    const dot = $('#col-sb-dot').style;
    dot.left = (s * 100) + '%';
    dot.top = ((1 - v) * 100) + '%';
    $('#col-hue-bar').style.top = (h / 360 * 100) + '%';
  }

  // Drag anywhere in a picker surface: live while the pointer is down, one
  // history entry when it comes up, same as the component sliders.
  function pickerDrag(el, fn) {
    let down = false;
    const at = e => {
      const r = el.getBoundingClientRect();
      const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      const y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
      state.hsb = fn(x, y);
      pushColor(pickedColor(state.hsb), true);
    };
    el.addEventListener('pointerdown', e => {
      down = true;
      blurPanelField();
      el.setPointerCapture(e.pointerId);
      at(e);
      e.preventDefault();
    });
    el.addEventListener('pointermove', e => { if (down) at(e); });
    el.addEventListener('pointerup', e => {
      if (!down) return;
      down = false;
      el.releasePointerCapture(e.pointerId);
      if (C.commit(state.history, state.doc)) scheduleAutosave();
    });
  }
  pickerDrag(sbCanvas, (x, y) => [state.hsb[0], x, 1 - y]);
  pickerDrag(hueCanvas, (x, y) => [y * 360, state.hsb[1], state.hsb[2]]);

  const colSliders = $('#col-sliders');
  let sliderModel = null;

  function buildSliders() {
    if (sliderModel === state.colorModel) return;
    sliderModel = state.colorModel;
    colSliders.innerHTML = '';
    COLOR_MODELS[sliderModel].forEach((comp, i) => {
      const row = document.createElement('div');
      row.className = 'crow';
      row.innerHTML = '<label></label><input type="range" min="0" step="1">' +
        '<input class="num" type="number" min="0" step="1">';
      const [label, range, num] = row.children;
      label.textContent = comp.k;
      range.max = comp.max;
      num.max = comp.max;
      const push = (v, live) => {
        const vals = COLOR_MODELS[sliderModel].map((c, j) => +colSliders.children[j].children[1].value);
        vals[i] = v;
        // HSB typed here is authoritative — take it before the color round
        // trips, or a hue set on a gray would have nowhere to survive.
        if (sliderModel === 'hsb') state.hsb = [vals[0], vals[1] / 100, vals[2] / 100];
        pushColor(modelToColor(vals, sliderModel), live);
      };
      range.addEventListener('input', () => push(+range.value, true));
      range.addEventListener('change', () => { if (C.commit(state.history, state.doc)) scheduleAutosave(); });
      num.addEventListener('change', () => push(+num.value, false));
      colSliders.appendChild(row);
    });
  }

  function paintLabel(col) {
    if (!col) return 'None';
    return C.defaultSwatchName(col) + (col.space === 'separation' ? ' · spot' : '');
  }

  function syncPaintPanel() {
    buildSliders();
    for (const kind of ['fill', 'stroke']) {
      const col = effectivePaint(kind);
      state.paint[kind] = col;
      if (col) state.pick[kind] = col;
      const well = $('#well-' + kind);
      well.classList.toggle('none', !col);
      well.firstChild.style[kind === 'fill' ? 'background' : 'borderColor'] =
        col ? C.colorHex(col) : (kind === 'fill' ? '#ffffff' : '#ffffff');
    }
    const col = state.pick[state.target];
    rememberHsb(col);
    drawPicker();
    setVal($('#col-hex'), C.colorHex(col));
    setVal($('#col-model'), state.colorModel);
    colorToModel(col, state.colorModel).forEach((v, i) => {
      const row = colSliders.children[i];
      if (!row) return;
      setVal(row.children[1], Math.round(v));
      setVal(row.children[2], Math.round(v));
    });
    $('#fs-ink').textContent =
      (state.target === 'fill' ? 'Fill: ' : 'Stroke: ') + paintLabel(state.paint[state.target]);

    const shapes = selShapes();
    const alpha = shapes.length ? shapes[shapes.length - 1].opacity : 1;
    const pct = Math.round((alpha == null ? 1 : alpha) * 100);
    setVal($('#op-range'), pct);
    setVal($('#op-num'), pct);
    $('#op-range').disabled = $('#op-num').disabled = !shapes.length;
  }

  document.querySelectorAll('.fswells .well[data-paint]').forEach(b =>
    b.addEventListener('click', () => setTarget(b.dataset.paint)));
  $('#fs-swap').addEventListener('click', swapPaints);
  $('#fs-default').addEventListener('click', defaultPaints);
  $('#fs-none').addEventListener('click', () => pushColor(null, false));
  $('#col-model').addEventListener('change', e => { state.colorModel = e.target.value; render(); });
  $('#col-hex').addEventListener('change', e => {
    const rgb = C.hexToRgb(e.target.value);
    if (rgb) pushColor(C.makeColor({ space: 'rgb', values: rgb }), false);
    else render(); // unparseable — put the real value back
  });

  // Opacity: preview while dragging, one history entry on release.
  function pushOpacity(pct, live) {
    if (!state.sel.size) return;
    C.setOpacity(state.doc, [...state.sel], pct / 100);
    if (!live && C.commit(state.history, state.doc)) scheduleAutosave();
    render();
  }
  $('#op-range').addEventListener('input', e => pushOpacity(+e.target.value, true));
  $('#op-range').addEventListener('change', () => {
    if (C.commit(state.history, state.doc)) scheduleAutosave();
  });
  $('#op-num').addEventListener('change', e => pushOpacity(+e.target.value, false));

  // ---------- eyedropper ----------
  // Sampling reads an object's own attributes rather than the pixel it
  // painted, which is the whole point on a print document: a spot ink comes
  // back as the ink, and a CMYK build as the build. Only empty artboard falls
  // back to a flat colour.
  function sampleHitAt(wx, wy) {
    // Unlike selection this looks through locked layers — sampling only reads,
    // so if you can see a colour you can pick it.
    const visible = new Set(state.doc.layers.filter(l => l.visible).map(l => l.id));
    const tol = 3 / state.view.scale;
    for (let i = state.doc.shapes.length - 1; i >= 0; i--) {
      const s = state.doc.shapes[i];
      if (!visible.has(s.layer)) continue;
      if (C.hitTestShape(s, wx, wy, tol)) return s;
    }
    return null;
  }

  // Bare artboard is the white it is painted with; off the artboard there is
  // no artwork to sample and the tool does nothing.
  function sampleAppearance(wx, wy) {
    const hit = sampleHitAt(wx, wy);
    if (hit) return C.shapeAppearance(hit);
    const ab = state.doc.artboard;
    if (wx < 0 || wy < 0 || wx > ab.w || wy > ab.h) return null;
    return {
      fill: C.makeColor({ space: 'cmyk', values: [0, 0, 0, 0] }),
      stroke: null, strokeAttrs: null, opacity: 1,
    };
  }

  // Plain click takes the whole appearance the way Illustrator's does; shift
  // takes only the colour, into whichever well is targeted. live=true is the
  // drag, which keeps sampling as it passes over objects and lands as a single
  // history entry when the pointer comes up.
  function applySample(ap, colorOnly, live) {
    if (!ap) return;
    if (colorOnly) {
      pushColor(ap.fill || ap.stroke, live);
      return;
    }
    state.paint = { fill: ap.fill, stroke: ap.stroke };
    if (ap.fill) state.pick.fill = ap.fill;
    if (ap.stroke) state.pick.stroke = ap.stroke;
    if (state.sel.size) {
      C.applyAppearance(state.doc, [...state.sel], ap);
      if (!live && C.commit(state.history, state.doc)) scheduleAutosave();
    }
    render();
  }

  function showSample(wx, wy) {
    const ap = sampleAppearance(wx, wy);
    const col = ap && (ap.fill || ap.stroke);
    $('#s-sample i').style.background = col ? C.colorHex(col) : 'transparent';
    $('#s-sample b').textContent = col
      ? (col.space === 'separation' ? col.name + ' · spot' : C.defaultSwatchName(col))
      : (ap ? 'None' : '—');
  }

  // ---------- stroke options ----------
  function selStroke() {
    const withStroke = selShapes().filter(s => s.stroke);
    return withStroke.length ? withStroke[withStroke.length - 1].stroke : null;
  }

  function applyStroke(props) {
    if (!state.sel.size) return;
    mutate(d => C.setStrokeProps(d, [...state.sel], props));
  }

  const STROKE_SEGS = [
    { sel: '#st-cap', attr: 'cap', prop: 'cap' },
    { sel: '#st-join', attr: 'join', prop: 'join' },
    { sel: '#st-align', attr: 'align2', prop: 'align' },
  ];
  for (const seg of STROKE_SEGS) {
    document.querySelectorAll(seg.sel + ' button').forEach(b =>
      b.addEventListener('click', () => applyStroke({ [seg.prop]: b.dataset[seg.attr] })));
  }
  $('#st-w').addEventListener('change', e => applyStroke({ w: +e.target.value }));
  $('#st-miter').addEventListener('change', e => applyStroke({ miter: +e.target.value }));
  $('#st-dash').addEventListener('change', e => applyStroke({ dash: e.target.value }));

  function syncStrokePanel() {
    const st = selStroke();
    const on = !!st;
    setVal($('#st-w'), C.strokeProp(st, 'w'));
    setVal($('#st-miter'), C.strokeProp(st, 'miter'));
    setVal($('#st-dash'), st && st.dash ? st.dash.join(' ') : '');
    for (const el of [$('#st-w'), $('#st-miter'), $('#st-dash')]) el.disabled = !on;
    for (const seg of STROKE_SEGS) {
      const cur = C.strokeProp(st, seg.prop);
      document.querySelectorAll(seg.sel + ' button').forEach(b => {
        b.classList.toggle('on', on && b.dataset[seg.attr] === cur);
        b.disabled = !on;
      });
    }
  }

  // ---------- swatches ----------
  let swatchSig = null;

  function applySwatch(i) {
    const sw = (state.doc.swatches || [])[i];
    if (!sw) return;
    state.swatchSel = i;
    pushColor(C.swatchColor(sw), false);
  }

  function renameSwatchAt(i) {
    const sw = (state.doc.swatches || [])[i];
    if (!sw) return;
    const name = window.prompt('Swatch name', sw.name);
    if (name != null && name.trim()) mutate(d => C.renameSwatch(d, i, name));
  }

  function renderSwatches() {
    const list = state.doc.swatches || [];
    if (state.swatchSel >= list.length) state.swatchSel = -1;
    const sig = list.map(s => s.name + '|' + C.swatchKey(s)).join('\n') + '#' + state.swatchSel;
    if (sig === swatchSig) return;
    swatchSig = sig;
    const grid = $('#swatchgrid');
    grid.innerHTML = '';
    const none = document.createElement('div');
    none.className = 'swatch noneswatch';
    none.title = 'None';
    none.addEventListener('click', () => pushColor(null, false));
    grid.appendChild(none);
    list.forEach((sw, i) => {
      const el = document.createElement('div');
      el.className = 'swatch' + (sw.spot ? ' spot' : '') + (state.swatchSel === i ? ' sel' : '');
      el.style.background = C.rgbToHex(sw.rgb);
      el.title = sw.name + (sw.spot ? ' — spot ink' : '');
      el.dataset.swatch = String(i);
      el.addEventListener('click', () => applySwatch(i));
      el.addEventListener('dblclick', () => renameSwatchAt(i));
      grid.appendChild(el);
    });
    const sel = list[state.swatchSel];
    $('#swatchname').textContent = sel ? sel.name + (sel.spot ? ' — spot ink' : '') : '—';
    $('#sw-rename').disabled = $('#sw-delete').disabled = !sel;
  }

  $('#sw-new').addEventListener('click', addCurrentSwatch);
  $('#fs-tosw').addEventListener('click', addCurrentSwatch);
  function addCurrentSwatch() {
    const col = state.pick[state.target];
    if (!col) return;
    mutate(d => C.addSwatch(d, col));
    state.swatchSel = C.findSwatch(state.doc, col);
    render();
  }
  $('#sw-rename').addEventListener('click', () => renameSwatchAt(state.swatchSel));
  $('#sw-delete').addEventListener('click', () => {
    const i = state.swatchSel;
    if (i < 0) return;
    mutate(d => C.removeSwatch(d, i));
    state.swatchSel = -1;
    render();
  });

  // ---------- menus ----------
  const MENUS = {
    file: [
      { label: 'New', run: newFile },
      { label: 'Open…', kbd: '⌘O', run: openFile },
      { label: 'Save', kbd: '⌘S', run: saveFile },
      { label: 'Export PDF', kbd: '⌘E', run: exportPdfFile, enabled: () => state.doc.shapes.length > 0 },
    ],
    edit: [
      { label: 'Undo', kbd: '⌘Z', run: doUndo, enabled: () => C.canUndo(state.history) },
      { label: 'Redo', kbd: '⇧⌘Z', run: doRedo, enabled: () => C.canRedo(state.history) },
      { label: 'Select All', kbd: '⌘A', run: () => selectAll(), enabled: () => state.doc.shapes.length > 0 },
    ],
    object: [
      { label: 'Group', kbd: '⌘G', run: () => doGroup(), enabled: () => selUnitCount() >= 2 },
      { label: 'Ungroup', kbd: '⇧⌘G', run: () => doUngroup(), enabled: () => selHasGroup() },
      { label: 'Bring to Front', kbd: '⇧⌘]', run: () => doArrange('front'), enabled: () => state.sel.size > 0 },
      { label: 'Bring Forward', kbd: '⌘]', run: () => doArrange('forward'), enabled: () => state.sel.size > 0 },
      { label: 'Send Backward', kbd: '⌘[', run: () => doArrange('backward'), enabled: () => state.sel.size > 0 },
      { label: 'Send to Back', kbd: '⇧⌘[', run: () => doArrange('back'), enabled: () => state.sel.size > 0 },
    ],
  };

  // ---------- selection commands ----------
  function selUnitCount() {
    return state.sel.size ? C.selectionUnits(state.doc, [...state.sel]).length : 0;
  }
  function selHasGroup() {
    return selShapes().some(s => s.group);
  }
  function selectAll() {
    const ok = selectableLayers();
    setSel(state.doc.shapes.filter(s => ok.has(s.layer)).map(s => s.id));
    render();
  }
  function doGroup() {
    if (selUnitCount() < 2) return;
    mutate(d => C.groupShapes(d, [...state.sel]));
  }
  function doUngroup() {
    if (!selHasGroup()) return;
    mutate(d => {
      const roots = new Set(
        d.shapes.filter(s => state.sel.has(s.id)).map(s => C.rootGroupOf(d, s)).filter(Boolean));
      roots.forEach(gid => C.ungroupShapes(d, gid));
    });
  }
  function doArrange(how) {
    if (!state.sel.size) return;
    mutate(d => {
      const ids = [...state.sel];
      if (how === 'front') C.bringToFront(d, ids);
      else if (how === 'forward') C.bringForward(d, ids);
      else if (how === 'backward') C.sendBackward(d, ids);
      else C.sendToBack(d, ids);
    });
  }
  function doDelete() {
    if (!state.sel.size) return;
    mutate(d => { d.shapes = d.shapes.filter(s => !state.sel.has(s.id)); });
    state.sel.clear();
    render();
  }
  function nudge(dx, dy) {
    if (!state.sel.size) return;
    const m = C.mTranslate(dx, dy);
    mutate(d => {
      for (const s of d.shapes) if (state.sel.has(s.id)) s.cmds = C.transformCmds(s.cmds, m);
    });
  }

  document.querySelectorAll('.alignrow button[data-align]').forEach(b =>
    b.addEventListener('click', () => {
      if (b.disabled) return;
      mutate(d => C.alignUnits(d, [...state.sel], b.dataset.align));
    }));

  let openMenu = null; // {el, dd}
  function closeMenu() {
    if (!openMenu) return;
    openMenu.el.classList.remove('open');
    openMenu.dd.remove();
    openMenu = null;
  }
  function showMenu(el) {
    closeMenu();
    const items = MENUS[el.dataset.menu];
    if (!items) return;
    const dd = document.createElement('div');
    dd.className = 'dropdown';
    for (const it of items) {
      const div = document.createElement('div');
      const on = !it.enabled || it.enabled();
      div.className = 'item' + (on ? '' : ' disabled');
      div.innerHTML = '<span></span><span class="kbd"></span>';
      div.firstChild.textContent = it.label;
      div.lastChild.textContent = it.kbd || '';
      if (on) div.addEventListener('click', () => { closeMenu(); it.run(); });
      dd.appendChild(div);
    }
    const r = el.getBoundingClientRect();
    dd.style.left = r.left + 'px';
    dd.style.top = r.bottom + 2 + 'px';
    document.body.appendChild(dd);
    el.classList.add('open');
    openMenu = { el, dd };
  }
  document.querySelectorAll('#menubar .menu[data-menu]').forEach(el =>
    el.addEventListener('click', e => {
      e.stopPropagation();
      openMenu && openMenu.el === el ? closeMenu() : showMenu(el);
    }));
  window.addEventListener('pointerdown', e => {
    if (openMenu && !openMenu.dd.contains(e.target) && !openMenu.el.contains(e.target)) closeMenu();
  });

  // ---------- tools ----------
  function setTool(t) {
    if (!TOOLS[t]) return;
    state.tool = t;
    document.querySelectorAll('#toolbar button[data-tool]').forEach(b =>
      b.classList.toggle('active', b.dataset.tool === t));
    stagewrap.className = 'tool-' + t;
    $('#statusbar').classList.toggle('sampling', t === 'eyedrop');
    if (t !== 'eyedrop') $('#s-sample b').textContent = '—';
    updateReadouts();
  }

  document.querySelectorAll('#toolbar button[data-tool]').forEach(b =>
    b.addEventListener('click', () => setTool(b.dataset.tool)));

  // ---------- pointer: pan / zoom-click ----------
  function panActive(e) {
    return state.tool === 'hand' || state.space || e.button === 1;
  }

  canvas.addEventListener('pointerdown', e => {
    blurPanelField();
    if (panActive(e)) {
      state.autoFit = false;
      state.pan = { sx: e.clientX, sy: e.clientY, view0: { ...state.view } };
      stagewrap.classList.add('panning');
      canvas.setPointerCapture(e.pointerId);
      e.preventDefault();
      return;
    }
    if (state.tool === 'zoom') {
      state.autoFit = false;
      const r = canvas.getBoundingClientRect();
      const f = e.altKey ? 1 / 1.5 : 1.5;
      state.view = C.zoomAt(state.view, e.clientX - r.left, e.clientY - r.top, f);
      render();
      return;
    }
    if (state.tool === 'eyedrop') {
      if (e.button === 0) {
        canvas.setPointerCapture(e.pointerId);
        state.drag = { kind: 'sample', shift: e.shiftKey };
        const [wx, wy] = worldPt(e);
        applySample(sampleAppearance(wx, wy), e.shiftKey, true);
      }
      return;
    }
    if (state.tool !== 'select' || e.button !== 0) return;

    const [sx, sy] = screenPt(e);
    const [wx, wy] = worldPt(e);
    canvas.setPointerCapture(e.pointerId);

    // 1) bbox handles beat shape hits
    const h = hitHandle(sx, sy);
    if (h) {
      const b = h.bbox;
      if (h.type === 'scale') {
        const f = HANDLE_FRAC[h.c];
        let ax = b.x + (1 - f[0]) * b.w, ay = b.y + (1 - f[1]) * b.h; // opposite point
        if (e.altKey) { ax = b.x + b.w / 2; ay = b.y + b.h / 2; }
        state.drag = {
          kind: 'scale', c: h.c, ax, ay,
          hx: b.x + f[0] * b.w, hy: b.y + f[1] * b.h,
          axis: h.c === 'n' || h.c === 's' ? 'y' : h.c === 'e' || h.c === 'w' ? 'x' : 'xy',
          orig: snapshotSel(), moved: false,
        };
      } else {
        const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
        state.drag = {
          kind: 'rotate', cx, cy,
          a0: Math.atan2(wy - cy, wx - cx),
          orig: snapshotSel(), moved: false,
        };
      }
      return;
    }

    // 2) shape hit → select / toggle, arm move drag
    const hit = hitAt(wx, wy);
    if (hit) {
      if (e.shiftKey) {
        const unit = C.expandIds(state.doc, [hit.id]);
        if (state.sel.has(hit.id)) {
          unit.forEach(id => state.sel.delete(id));
          render();
          return; // deselected — no drag
        }
        unit.forEach(id => state.sel.add(id));
      } else if (!state.sel.has(hit.id)) {
        setSel([hit.id]);
      }
      state.drag = {
        kind: 'move', wx0: wx, wy0: wy,
        alt: e.altKey, dupDone: false,
        orig: snapshotSel(), moved: false,
      };
      render();
      return;
    }

    // 3) empty space → marquee
    state.drag = { kind: 'marquee', m0: [sx, sy], m1: [sx, sy], shift: e.shiftKey, moved: false };
  });

  canvas.addEventListener('pointermove', e => {
    if (state.pan) {
      state.view = C.panBy(state.pan.view0, e.clientX - state.pan.sx, e.clientY - state.pan.sy);
      render();
    }
    const [sx, sy] = screenPt(e);
    const [wx, wy] = worldPt(e);
    const d = state.drag;
    if (d) {
      if (d.kind === 'move') {
        const dx = wx - d.wx0, dy = wy - d.wy0;
        if (!d.moved && Math.hypot(dx, dy) * state.view.scale < 3) { /* click slack */ }
        else {
          if (d.alt && !d.dupDone) { // alt-drag: copy moves, original stays
            const ids = C.duplicateShapes(state.doc, [...state.sel]);
            setSel(ids);
            d.orig = snapshotSel();
            d.dupDone = true;
          }
          d.moved = true;
          applyDragMatrix(C.mTranslate(dx, dy));
          render();
        }
      } else if (d.kind === 'scale') {
        let fx = 1, fy = 1;
        const dx0 = d.hx - d.ax, dy0 = d.hy - d.ay;
        if (d.axis !== 'y' && Math.abs(dx0) > 1e-9) fx = (wx - d.ax) / dx0;
        if (d.axis !== 'x' && Math.abs(dy0) > 1e-9) fy = (wy - d.ay) / dy0;
        if (e.shiftKey && d.axis === 'xy') fy = fx;
        if (isFinite(fx) && isFinite(fy)) {
          d.moved = true;
          applyDragMatrix(C.mScale(fx, fy, d.ax, d.ay));
          render();
        }
      } else if (d.kind === 'rotate') {
        let da = Math.atan2(wy - d.cy, wx - d.cx) - d.a0;
        if (e.shiftKey) da = Math.round(da / (Math.PI / 4)) * (Math.PI / 4);
        d.moved = true;
        applyDragMatrix(C.mRotate(da, d.cx, d.cy));
        render();
      } else if (d.kind === 'marquee') {
        d.m1 = [sx, sy];
        d.moved = true;
        render();
      } else if (d.kind === 'sample') {
        applySample(sampleAppearance(wx, wy), d.shift, true);
        showSample(wx, wy);
      }
    } else if (state.tool === 'select' && !state.pan) {
      const hh = hitHandle(sx, sy);
      canvas.style.cursor = hh ? (hh.type === 'rotate' ? 'crosshair' : HANDLE_CURSOR[hh.c]) : '';
    } else if (state.tool === 'eyedrop') {
      showSample(wx, wy);
    }
    const k = C.PT_PER[state.doc.units];
    $('#s-coords').textContent = `x: ${(wx / k).toFixed(2)} ${state.doc.units}   y: ${(wy / k).toFixed(2)} ${state.doc.units}`;
  });

  canvas.addEventListener('pointerup', e => {
    if (state.pan) {
      state.pan = null;
      stagewrap.classList.remove('panning');
      canvas.releasePointerCapture(e.pointerId);
      return;
    }
    const d = state.drag;
    if (!d) return;
    state.drag = null;
    if (d.kind === 'sample') {
      commitNow(); // the whole sampling drag is one step
      render();
      return;
    }
    if (d.kind === 'marquee') {
      if (!d.moved) {
        if (!d.shift) { state.sel.clear(); render(); }
        return;
      }
      const v = state.view;
      const [ax, ay] = C.s2w(v, Math.min(d.m0[0], d.m1[0]), Math.min(d.m0[1], d.m1[1]));
      const [bx, by] = C.s2w(v, Math.max(d.m0[0], d.m1[0]), Math.max(d.m0[1], d.m1[1]));
      const rect = { x: ax, y: ay, w: bx - ax, h: by - ay };
      const ok = selectableLayers();
      const ids = state.doc.shapes
        .filter(s => ok.has(s.layer))
        .filter(s => { const b = C.tightBBox(s.cmds); return b && C.rectsIntersect(b, rect); })
        .map(s => s.id);
      setSel(d.shift ? [...state.sel, ...ids] : ids);
      render();
    } else if (d.moved) {
      commitNow();
      render();
    }
  });

  // wheel = zoom at cursor (trackpad pinch arrives as ctrl+wheel — same path)
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    state.autoFit = false;
    const r = canvas.getBoundingClientRect();
    const f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015));
    state.view = C.zoomAt(state.view, e.clientX - r.left, e.clientY - r.top, f);
    render();
  }, { passive: false });

  // ---------- keyboard ----------
  window.addEventListener('keydown', e => {
    const mod = e.metaKey || e.ctrlKey;
    const k = e.key.toLowerCase();
    // Panel fields own their keystrokes; only the app-level modifiers get through.
    const inField = /^(INPUT|SELECT|TEXTAREA)$/.test(e.target && e.target.tagName);
    if (inField && e.key === 'Escape') { e.target.blur(); return; }
    if (inField && !mod) return;
    if (e.key === 'Escape') {
      closeMenu();
      if (state.sel.size) { state.sel.clear(); render(); }
      return;
    }
    if (mod && (k === 'y' || (e.shiftKey && k === 'z'))) { doRedo(); e.preventDefault(); return; }
    if (mod && k === 'z') { doUndo(); e.preventDefault(); return; }
    if (mod && k === 's') { saveFile(); e.preventDefault(); return; }
    if (mod && k === 'o') { openFile(); e.preventDefault(); return; }
    if (mod && k === 'e') { exportPdfFile(); e.preventDefault(); return; }
    if (mod && k === 'a') { selectAll(); e.preventDefault(); return; }
    if (mod && k === 'g') { e.shiftKey ? doUngroup() : doGroup(); e.preventDefault(); return; }
    if (mod && e.key === ']') { doArrange(e.shiftKey ? 'front' : 'forward'); e.preventDefault(); return; }
    if (mod && e.key === '[') { doArrange(e.shiftKey ? 'back' : 'backward'); e.preventDefault(); return; }
    if (!mod && (e.key === 'Delete' || e.key === 'Backspace')) { doDelete(); e.preventDefault(); return; }
    if (!mod && e.key.startsWith('Arrow') && state.sel.size) {
      const step = e.shiftKey ? 10 : 1;
      nudge(
        e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0,
        e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0);
      e.preventDefault();
      return;
    }
    if (!mod && k === 'x') {
      if (e.shiftKey) swapPaints(); else setTarget(state.target === 'fill' ? 'stroke' : 'fill');
      e.preventDefault();
      return;
    }
    if (!mod && k === 'd' && !e.shiftKey) { defaultPaints(); e.preventDefault(); return; }
    if (e.code === 'Space' && !e.repeat) {
      state.space = true;
      stagewrap.classList.add('tool-hand');
      e.preventDefault();
      return;
    }
    if (mod && e.key === '0') { state.autoFit = true; fitArtboard(); render(); e.preventDefault(); return; }
    if (mod && e.key === '1') {
      state.autoFit = false;
      state.view = C.zoomAt(state.view, vw / 2, vh / 2, C.PX_PER_PT_100 / state.view.scale);
      render(); e.preventDefault(); return;
    }
    if (mod && (e.key === '=' || e.key === '+')) {
      state.autoFit = false;
      state.view = C.zoomAt(state.view, vw / 2, vh / 2, 1.25); render(); e.preventDefault(); return;
    }
    if (mod && e.key === '-') {
      state.autoFit = false;
      state.view = C.zoomAt(state.view, vw / 2, vh / 2, 1 / 1.25); render(); e.preventDefault(); return;
    }
    if (!mod && TOOL_KEYS[e.key.toLowerCase()]) setTool(TOOL_KEYS[e.key.toLowerCase()]);
  });

  window.addEventListener('keyup', e => {
    if (e.code === 'Space') {
      state.space = false;
      if (state.tool !== 'hand') stagewrap.className = 'tool-' + state.tool;
    }
  });

  $('#btn-fit').addEventListener('click', () => { state.autoFit = true; fitArtboard(); render(); });
  $('#btn-100').addEventListener('click', () => {
    state.autoFit = false;
    state.view = C.zoomAt(state.view, vw / 2, vh / 2, C.PX_PER_PT_100 / state.view.scale);
    render();
  });

  // ---------- boot ----------
  window.addEventListener('resize', resize);
  new ResizeObserver(resize).observe(stagewrap);
  setTool('select');
  renderLayers();
  resize();

  // debug handle
  window.VEC_STUDIO = {
    state, render, setTool, fitArtboard, VECCORE: C,
    mutate, doUndo, doRedo, newFile, openFile, saveFile, applyNewDoc,
    openAnyFile, exportPdfFile,
    setSel, selectAll, doGroup, doUngroup, doArrange, doDelete, nudge,
    setTarget, pushColor, pushOpacity, swapPaints, defaultPaints,
    sampleAppearance, applySample,
    applyStroke, applySwatch, addCurrentSwatch, renameSwatchAt,
  };
})();

</script>
</body>
</html>
